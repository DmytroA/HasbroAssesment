services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      STORE_NAME: ${STORE_NAME:-The Gathering Place}
      STORE_LOCATION: ${STORE_LOCATION:-123 Main Street, Seattle, WA}
      STORE_TIME_ZONE: ${STORE_TIME_ZONE:-America/Los_Angeles}
    volumes:
      - tabletop-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  tabletop-data:
